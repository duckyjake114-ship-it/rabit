<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang chủ | Mọt Sách</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="trang-chu">
  <header class="thanh-dieu-huong">
    <a href="index.html" class="logo">📚 Mọt Sách</a>
    <div class="khu-nguoi-dung">
      <span class="anh-dai-dien" id="chu-cai-dau"></span>
      <span id="ten-nguoi-dung"></span>
      <button id="nut-dang-xuat" class="nut-phu">Đăng xuất</button>
    </div>
  </header>

  <main class="noi-dung">
    <section class="bang-chao">
      <h1 id="loi-chao">Xin chào!</h1>
      <p>Bạn đã đăng nhập thành công. Hôm nay bạn muốn đọc gì?</p>
    </section>

    <section class="the-thong-tin">
      <h2>Thông tin tài khoản</h2>
      <dl>
        <dt>Email</dt><dd id="tt-email"></dd>
        <dt>Số điện thoại</dt><dd id="tt-sdt"></dd>
        <dt>Ngày tham gia</dt><dd id="tt-ngay-tao"></dd>
      </dl>
    </section>

    <section>
      <h2>Sách gợi ý cho bạn</h2>
      <div id="luoi-sach" class="luoi-sach"></div>
    </section>
  </main>

  <footer class="chan-trang">© 2026 Mọt Sách — Dự án SPCK</footer>

  <script src="js/xac-thuc.js"></script>
  <script src="js/trang-chu.js"></script>
</body>
</html>
